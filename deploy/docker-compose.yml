# Everything that runs on the EC2 server.
#
# Don't run this file by hand; use deploy/deploy.sh, which passes the settings file.
# Secrets live OUTSIDE the code, in the ~/chuvachi folder on the server:
#   ~/chuvachi/.env       POSTGRES_PASSWORD and the public website settings (NEXT_PUBLIC_...)
#   ~/chuvachi/api.env    the backend's settings and secrets
#   ~/chuvachi/certs/     the Cloudflare origin certificate for HTTPS

# Same project name as before, so the existing database volume (chuvachi_db-data) is kept.
name: chuvachi

services:
  db:
    image: postgres:17
    container_name: chuvachi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chuvachi_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chuvachi_prod
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Only reachable from inside the server (and through the SSH tunnel), never from the internet.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chuvachi_admin -d chuvachi_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ../backend
    container_name: chuvachi-api
    restart: unless-stopped
    env_file: ../../api.env
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m

  web:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: https://api.chuvachi.com
        NEXT_PUBLIC_IMAGE_BASE_URL: https://img.chuvachi.com
        NEXT_PUBLIC_SITE_URL: https://chuvachi.com
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        API_URL: https://api.chuvachi.com
    container_name: chuvachi-web
    restart: unless-stopped
    environment:
      # Server-side requests go straight to the API inside the server.
      API_URL: http://api:4000
    depends_on:
      - api
    mem_limit: 768m

  caddy:
    image: caddy:2
    container_name: chuvachi-caddy
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    # Only the API: the website is built later and needs Caddy (and the API) already running.
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
  caddy-config:
